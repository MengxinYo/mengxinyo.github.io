	<!--
		CRITICAL LOADER STYLES — inlined on purpose.
	
		Every ordinary stylesheet link blocks first paint. When the loader was
		styled by one, the curtain could not appear until the very resources it
		exists to cover had already downloaded — so a slow connection produced a
		long blank white screen and *then* a loading animation, which is exactly
		backwards. Inlining this means the loader paints on the first frame with
		no network dependency at all.
	
		This is only the resting appearance. The exit sequence and reduced-motion
		rules live in assets/css/preloader.css, which loads asynchronously below
		and is always in place long before the curtain lifts.
	-->
	<style>
	.preloader{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;display:flex;
	flex-direction:column;align-items:center;justify-content:center;background:#fff;
	opacity:0;visibility:hidden}
	.js-loading .preloader{opacity:1;visibility:visible}
	.preloader__mark{margin-bottom:22px;font-family:"Quicksand",Arial,sans-serif;
	font-size:10px;font-weight:500;letter-spacing:5px;text-transform:uppercase;color:#9a9a9a}
	.preloader__track{position:relative;width:240px;max-width:60vw;height:1px;
	background:rgba(0,0,0,.09);overflow:hidden}
	.preloader__bar{position:absolute;top:0;right:0;bottom:0;left:0;background:#111;
	transform:scaleX(0);transform-origin:center}
	.preloader__sheen{position:absolute;top:0;right:0;bottom:0;left:0;
	background:linear-gradient(90deg,transparent,rgba(0,0,0,.28),transparent);
	transform:translateX(-100%);animation:preSheen 1.6s ease-in-out infinite}
	@keyframes preSheen{to{transform:translateX(100%)}}
	</style>
	<script>
		/* Runs before the body is parsed, so the curtain is visible on the very
		   first frame. Added by JS so a browser without it never sees a curtain
		   it has no way to dismiss. */
		document.documentElement.classList.add('js', 'js-loading');
	</script>
