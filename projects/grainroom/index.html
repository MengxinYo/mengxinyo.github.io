<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grainroom — Digital Texture Studio</title>
  <meta name="description" content="Turn photographs into dither, ASCII, and lunar phase art in the browser.">
  <link rel="stylesheet" href="grainroom.css">
</head>
<body>
  <main class="grainroom-app">
    <header class="app-header">
      <a class="brand" href="#" aria-label="Grainroom home"><span class="brand-mark">▦</span>grainroom</a>
    </header>

    <div class="workspace">
      <aside class="controls" aria-label="Image controls">
        <section>
          <div class="section-title"><span>01</span><h2>Effect</h2></div>
          <div class="mode-grid" role="group" aria-label="Effect">
            <button class="mode is-active" type="button" data-mode="dither" aria-pressed="true"><b>░</b><span>Dither</span></button>
            <button class="mode" type="button" data-mode="ascii" aria-pressed="false"><b>A</b><span>ASCII</span></button>
            <button class="mode mode--wide" type="button" data-mode="moon" aria-pressed="false"><b>◐</b><span>Long May The Moonlight</span></button>
          </div>
        </section>

        <section>
          <div class="section-title"><span>02</span><h2>Color recipe</h2></div>
          <div class="palette-grid" role="group" aria-label="Color recipe">
            <button class="palette is-active" type="button" data-palette="0" aria-pressed="true"><i class="swatch swatch--silver"></i><span>Silver</span><em></em></button>
            <button class="palette" type="button" data-palette="1" aria-pressed="false"><i class="swatch swatch--indigo"></i><span>Indigo</span><em></em></button>
            <button class="palette" type="button" data-palette="2" aria-pressed="false"><i class="swatch swatch--sunset"></i><span>Sunset</span><em></em></button>
            <button class="palette" type="button" data-palette="3" aria-pressed="false"><i class="swatch swatch--paper"></i><span>Paper</span><em></em></button>
          </div>
        </section>

        <section>
          <div class="section-title"><span>03</span><h2>Fine tune</h2><button class="reset" type="button" aria-label="Reset settings" title="Reset settings">↻</button></div>
          <label class="select-row" data-algorithm-row><span>Algorithm</span><select data-algorithm><option value="atkinson">Atkinson</option><option value="floyd">Floyd–Steinberg</option></select></label>
          <label class="range-row"><span><b data-size-label>Grain size</b><output data-size-output>3 px</output></span><input data-size type="range" min="1" max="12" value="3" step="1"></label>
          <label class="range-row"><span><b>Contrast</b><output data-contrast-output>1.3</output></span><input data-contrast type="range" min="0.5" max="2.5" value="1.3" step="0.05"></label>
          <label class="range-row"><span><b>Exposure</b><output data-exposure-output>0</output></span><input data-exposure type="range" min="-60" max="60" value="0" step="1"></label>
          <div class="moon-controls" data-moon-controls hidden>
            <label class="range-row"><span><b>Tone balance</b><output data-equalize-output>0.3</output></span><input data-equalize type="range" min="0" max="1" value="0.3" step="0.05"></label>
            <label class="range-row"><span><b>Glyph fill</b><output data-gap-output>0.88</output></span><input data-gap type="range" min="0.5" max="1" value="0.88" step="0.02"></label>
            <label class="range-row"><span><b>Shadow cutoff</b><output data-floor-output>0</output></span><input data-floor type="range" min="0" max="0.4" value="0" step="0.02"></label>
            <label class="switch-row"><span>Shadow stars</span><input data-stars type="checkbox" checked><i></i></label>
          </div>
          <label class="switch-row"><span>Invert tones</span><input data-invert type="checkbox"><i></i></label>
        </section>
      </aside>

      <section class="editor" aria-label="Image editor">
        <div class="editor-bar">
          <div class="file-actions"><span class="file-name" data-file-name></span></div>
          <button class="download" type="button" data-download disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg>
            Download image <span>PNG</span>
          </button>
        </div>

        <div class="stage" data-stage>
          <div class="empty-state" data-empty>
            <div class="grain-orb" aria-hidden="true"></div>
            <button class="upload" type="button" data-pick>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 15v5h14v-5"/></svg>
              Upload image
            </button>
            <small>JPG · PNG · WEBP · AVIF · GIF / 30 MB MAX</small>
          </div>
          <div class="image-scroll" data-image-scroll hidden><div class="image-wrap" data-image-wrap><canvas data-canvas aria-label="Processed image"></canvas><img data-original alt="Original image" hidden></div></div>
          <span class="canvas-label" data-canvas-label hidden></span>
          <div class="processing" data-processing hidden>Processing…</div>
        </div>

        <div class="bottom-bar">
          <span class="dimensions" data-dimensions></span>
          <div class="zoom-tools">
            <button type="button" data-zoom-out aria-label="Zoom out" disabled>−</button><span data-zoom-value>100%</span><button type="button" data-zoom-in aria-label="Zoom in" disabled>＋</button>
          </div>
          <button class="compare" type="button" data-compare disabled>⇆ Compare original</button>
        </div>
        <p class="error" data-error role="alert" hidden></p>
      </section>
    </div>
    <input data-file-input type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/gif" hidden>
  </main>
  <script src="grainroom.js"></script>
</body>
</html>
